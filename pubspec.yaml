name: hooko_v20
description: "A new Flutter project."
publish_to: "none"

version: 1.0.3+2

environment:
  sdk: ^3.6.0
dependencies:
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.2
  flutter_timezone: ^5.0.0
  purchases_flutter: ^10.0.0
  http: ^1.0.0
  intl: any
  visibility_detector: 0.4.0+2
  device_info_plus: ^12.0.0
  video_compress: ^3.0.0
  uuid: ^4.0.0
  easy_video_editor: 0.1.3
  photo_manager: ^3.0.0
  image_picker: '>=1.1.2'
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0
  universal_html: ^2.2.4
  video_player: '>=2.9.2'
  file_picker: '>=8.1.2'
  web: ^1.1.1
  url_launcher_web: ^2.4.1
  url_launcher: ^6.2.0
  supabase_flutter: '>=1.10.0'
  flutter_svg: ^2.0.17
  flutter:
    sdk: flutter
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  # Use a single, square PNG (recommended 1024x1024) for all platforms
  image_path: "assets/images/launcher.png"
  # android directory is not present in this repo; disable to avoid script failure
  android: false
  # Safe default if Android is added later
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/launcher.png"
    background_color: "#ffffff"
    theme_color: "#111111"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/videos/
  fonts:
    - family: Geom
      fonts:
        - asset: assets/fonts/Geom-Light.ttf
          weight: 300
        - asset: assets/fonts/Geom-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Geom-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geom-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geom-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geom-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geom-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geom-Black.ttf
          weight: 900
dependency_overrides:
  file_picker: 8.1.2
